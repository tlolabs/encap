[workspace]
members = [
    "crates/encap-core",
    "crates/encap-ffmpeg",
    "crates/encap-audio",
    "crates/encap-transcript",
    "crates/encap-video",
    "crates/encap-engine",
    "crates/encap-release",
    "crates/encap-update",
    "crates/encap-portable-update",
    "updater",
]
resolver = "2"

[workspace.package]
version = "2.0.11"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/tlolabs/encap"

[workspace.dependencies]
# Core owns the matched, validated FFmpeg/ffprobe runtime.
avid-core = { git = "https://github.com/tlolabs/avid-core.git", rev = "8e27a86ec106028d93130de35a35c0eeda7a9ce3", version = "=0.3.3" }
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
time = { version = "0.3.55", features = ["formatting"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "4.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
