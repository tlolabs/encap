      - name: Compile native desktop adapters
        shell: pwsh
        run: |
          cmake -S desktop/native -B 'build/desktop-native-win-arm64' -A 'ARM64'
          if ($LASTEXITCODE -ne 0) { throw 'Native adapter configuration failed' }
