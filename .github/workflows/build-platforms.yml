name: Build platform applications

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform group to qualify
        type: choice
        options: [all, macos, windows, linux, checks, runtime-probes]
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ENCAP_UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  WHISPER_CPP_VERSION: "v1.9.1"
  WHISPER_CPP_COMMIT: "f049fff95a089aa9969deb009cdd4892b3e74916"

jobs:
  quality:
    defaults:
      run:
        working-directory: EnCAP
    name: Native engine checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Enforce native-only source policy
        run: ./script/check_no_python.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: |
          cargo test --workspace --locked --all-features
          python3 script/test_runtime_ownership.py
          python3 script/check_desktop_dependencies.py
          python3 script/test_desktop_distribution.py
      - name: Build native engine
        run: cargo build --package encap-engine --locked

  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos') }}
    defaults:
      run:
        working-directory: EnCAP
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
            arch: arm64
          - runner: macos-15-intel
            label: intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Install application build prerequisites
        run: |
          brew install cmake jq
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12+ required"'
      - name: Acquire AVID Core FFmpeg
        uses: ./EnCAP/.github/actions/core-ffmpeg
        with:
          platform: macos
          arch: ${{ matrix.arch }}
      - name: Configure update verification key
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          if [[ -n "$UPDATE_PUBLIC_KEY" ]]; then
            printf '%s\n' "$UPDATE_PUBLIC_KEY" > .encap-update-public-key
          else
            printf '%s\n' 'development-build-no-update-key' > .encap-update-public-key
          fi
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build, test, sign, and package native app
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: ./script/build_and_run.sh --package
      - name: Test complete native Rust workspace
        if: ${{ !cancelled() }}
        run: |
          if [[ -x "$PWD/dist/EnCap.app/Contents/MacOS/encap-engine" ]]; then
            export ENCAP_TEST_ENGINE="$PWD/dist/EnCap.app/Contents/MacOS/encap-engine"
          fi
          cargo test --workspace --locked --all-features --no-fail-fast
      - name: Test native models
        run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test --package-path macos --scratch-path build/native-swift
      - name: Verify packaged media tools
        run: |
          dist/EnCap.app/Contents/MacOS/encap-engine validate-tools
          dist/EnCap.app/Contents/MacOS/ffmpeg -hide_banner -version
          if otool -L dist/EnCap.app/Contents/MacOS/ffmpeg | grep -E '/(opt|usr/local)/homebrew|/Cellar/'; then exit 1; fi
          codesign --verify --deep --strict dist/EnCap.app
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-macos-${{ matrix.label }}
          path: EnCAP/dist/EnCap-*-macos-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: Install pinned .NET SDK for internal reference
        if: matrix.arch == 'arm64'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: EnCAP/global.json
      - name: Test and package internal shared UI reference
        if: matrix.arch == 'arm64'
        run: |
          dotnet run --project desktop/EnCap.Tests --configuration Release -- tests/fixtures/chapter-times.tsv
          python3 script/build_desktop.py --rid osx-arm64 --tools dist/EnCap.app/Contents/MacOS
          python3 script/test_desktop_distribution.py
      - name: Upload INTERNAL reference only
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: EnCap-INTERNAL-Avalonia-Reference-osx-arm64
          path: EnCAP/dist/internal/*-INTERNAL-Avalonia-Reference-osx-arm64.zip
          if-no-files-found: error

  windows:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows'
    defaults:
      run:
        working-directory: EnCAP
    name: Windows ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-2025
            arch: x86_64
            msystem: UCRT64
            compiler: gcc
            package_prefix: mingw-w64-ucrt-x86_64
            rust_target: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            cmake_arch: x64
            cmake_toolset: ""
            pe_machine: "8664"
          - label: arm64
            runner: windows-11-arm
            arch: arm64
            msystem: CLANGARM64
            compiler: clang
            package_prefix: mingw-w64-clang-aarch64
            rust_target: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            cmake_arch: ARM64
            cmake_toolset: ClangCL
            pe_machine: "AA64"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Install Rust target
        shell: pwsh
        run: rustup target add '${{ matrix.rust_target }}'
      - name: Install native packaging and Whisper build tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit # Core acquisition invokes the runner-provided GitHub CLI.
          update: true
          install: >-
            make curl tar xz git python
            ${{ matrix.package_prefix }}-${{ matrix.compiler }}
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-jq
            ${{ matrix.package_prefix }}-binutils
            ${{ matrix.package_prefix }}-llvm
      - name: Acquire AVID Core FFmpeg
        uses: ./EnCAP/.github/actions/core-ffmpeg
        with:
          platform: windows
          arch: ${{ matrix.arch }}
          shell: msys2 {0}
      - name: Verify synthetic portrait pipeline
        shell: msys2 {0}
        run: bash script/ffmpeg/probe-portrait.sh "$ENCAP_FFMPEG_RUNTIME/ffmpeg.exe"
      - name: Build local Whisper runtime
        shell: pwsh
        run: |
          git clone --branch $env:WHISPER_CPP_VERSION --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-cpp
          if ((git -C .whisper-cpp rev-parse HEAD) -ne $env:WHISPER_CPP_COMMIT) { throw 'whisper.cpp commit mismatch' }
          $configure = @('-S', '.whisper-cpp', '-B', '.whisper-cpp/build', '-A', '${{ matrix.cmake_arch }}')
          if ('${{ matrix.cmake_toolset }}') { $configure += @('-T', '${{ matrix.cmake_toolset }}') }
          $configure += @('-DCMAKE_BUILD_TYPE=Release', '-DBUILD_SHARED_LIBS=OFF', '-DGGML_NATIVE=OFF', '-DGGML_OPENMP=OFF', '-DWHISPER_BUILD_TESTS=OFF', '-DWHISPER_BUILD_SERVER=OFF')
          cmake @configure
          cmake --build .whisper-cpp/build --config Release --target whisper-cli
      - name: Build shared Rust engine
        shell: pwsh
        run: |
          cargo test --workspace --all-features --locked --target '${{ matrix.rust_target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Native workspace tests failed' }
          cargo build --package encap-engine --package encap-update --release --locked --target '${{ matrix.rust_target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Native engine build failed' }
      - name: Check portable persistence tests for target architecture
        shell: pwsh
        run: cargo check --locked -p encap-core --tests --target '${{ matrix.rust_target }}'
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: EnCAP/global.json
      - name: Test shared application and headless UI
        shell: pwsh
        run: |
          python script/update_config.py --props build/version.props
          dotnet run --project desktop/EnCap.Tests --configuration Release -- tests/fixtures/chapter-times.tsv
      - name: Publish portable update installer
        shell: pwsh
        run: |
          python script/update_config.py --props build/version.props
          dotnet publish windows/PortableUpdate/PortableUpdate.csproj -c Release -r '${{ matrix.runtime }}' --self-contained true -o build/portable-update
          if ($LASTEXITCODE -ne 0) { throw 'Updater bootstrapper build failed' }
      - name: Assemble and verify portable package
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force build/desktop-tools
          Copy-Item 'target/${{ matrix.rust_target }}/release/encap-engine.exe' "$stage/encap-engine.exe"
          Copy-Item 'target/${{ matrix.rust_target }}/release/encap-update.exe' "$stage/encap-update.exe"
          Copy-Item 'build/portable-update/encap-portable-update.exe' "$stage/encap-portable-update.exe"
          python script/update_config.py $stage 'windows-${{ matrix.label }}'
          if ($LASTEXITCODE -ne 0) { throw 'Updater package identity failed' }
          msys2 -c 'bash script/ffmpeg/stage.sh "$ENCAP_FFMPEG_RUNTIME" build/desktop-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Core FFmpeg staging failed' }
          $whisper = Get-ChildItem .whisper-cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (!$whisper) { throw 'whisper-cli build is missing' }
          Copy-Item $whisper.FullName "$stage/whisper-cli.exe"
          Copy-Item THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          Copy-Item 'runtime/AVID_CORE_LICENSE.txt' "$stage/AVID_CORE_LICENSE.txt"
          (& "$stage/ffmpeg.exe" -buildconf 2>&1) | Set-Content "$stage/FFMPEG_BUILD_CONFIGURATION.txt"
          python script/build_desktop.py --rid '${{ matrix.runtime }}' --tools build/desktop-tools
          if ($LASTEXITCODE -ne 0) { throw 'Shared desktop build failed' }
          $stage = Resolve-Path dist/staging/EnCap
          function Assert-PeMachine([string] $path, [uint16] $expected) {
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "$path is not a PE executable" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "$path has an invalid PE header" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expected) { throw "$path has PE machine 0x$($machine.ToString('X4')); expected 0x$($expected.ToString('X4'))" }
          }
          $expectedMachine = [Convert]::ToUInt16('${{ matrix.pe_machine }}', 16)
          foreach ($executable in @('EnCap.exe', 'encap-engine.exe', 'encap-update.exe', 'encap-portable-update.exe', 'ffmpeg.exe', 'ffprobe.exe', 'whisper-cli.exe')) {
            Assert-PeMachine "$stage/$executable" $expectedMachine
          }
          & {
            $env:ENCAP_TEST_PACKAGED = "1"
            $env:ENCAP_TEST_ENGINE = "$stage/encap-engine.exe"
            $env:ENCAP_FFMPEG = "$stage/ffmpeg.exe"
            $env:ENCAP_FFPROBE = "$stage/ffprobe.exe"
            $env:PATH = "$stage;" + $env:PATH
            cargo test --locked -p encap-core
            if ($LASTEXITCODE -ne 0) { throw 'EnCAP persistence tests failed' }
            cargo test --locked -p encap-engine --test save_protocol -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'EnCAP packaged save tests failed' }
            cargo test --locked -p encap-ffmpeg
            if ($LASTEXITCODE -ne 0) { throw 'Media lifecycle tests failed' }
            & "$stage/encap-engine.exe" validate-tools
            & "$stage/ffmpeg.exe" -hide_banner -version
          }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $managed = @(Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($stage, $_.FullName) })
          ConvertTo-Json -InputObject $managed | Set-Content -Encoding utf8 "$stage/portable-package-files.json"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/release/EnCap-$version-windows-${{ matrix.label }}.zip"
      - name: Verify packaged runtime discovery and rejection
        shell: bash
        run: bash script/ffmpeg/qualify.sh dist/staging/EnCap/encap-engine.exe
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-windows-${{ matrix.label }}
          path: EnCAP/dist/release/*.zip
          if-no-files-found: error

  linux:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux'
    defaults:
      run:
        working-directory: EnCAP
    name: Linux ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: x64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            label: arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs build-essential cmake curl libglib2.0-dev libx11-dev libice-dev libsm-dev libfontconfig1-dev libxrandr-dev libxi-dev libxcursor-dev libasound2-dev ninja-build xvfb dbus-x11 xz-utils pkg-config jq
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Acquire AVID Core FFmpeg
        uses: ./EnCAP/.github/actions/core-ffmpeg
        with:
          platform: linux
          arch: ${{ matrix.arch }}
      - name: Build shared engine and bundled media tools
        run: |
          cargo test --workspace --locked --all-features
          cargo build --package encap-engine --package encap-update --release --locked
      - name: Build local Whisper runtime
        run: |
          git clone --branch "$WHISPER_CPP_VERSION" --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-cpp
          test "$(git -C .whisper-cpp rev-parse HEAD)" = "$WHISPER_CPP_COMMIT"
          cmake -S .whisper-cpp -B .whisper-cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build .whisper-cpp/build --config Release --target whisper-cli
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: EnCAP/global.json
      - name: Test shared application and headless UI
        run: dotnet run --project desktop/EnCap.Tests --configuration Release -- tests/fixtures/chapter-times.tsv
      - name: Build and assemble Avalonia AppImage
        run: |
          prefix="$PWD/build/desktop-tools"
          mkdir -p "$prefix/bin"
          ffmpeg_prefix="$ENCAP_FFMPEG_RUNTIME"
          cp target/release/encap-engine "$prefix/bin/encap-engine"
          cp target/release/encap-update "$prefix/bin/encap-update"
          python3 script/update_config.py "$prefix/bin" 'linux-${{ matrix.label }}-appimage'
          bash script/ffmpeg/stage.sh "$ffmpeg_prefix" "$prefix/bin"
          cp .whisper-cpp/build/bin/whisper-cli "$prefix/bin/whisper-cli"
          cp THIRD_PARTY_NOTICES.md "$prefix/THIRD_PARTY_NOTICES.md"
          cp 'runtime/AVID_CORE_LICENSE.txt' "$prefix/AVID_CORE_LICENSE.txt"
          "$prefix/bin/ffmpeg" -buildconf > "$prefix/FFMPEG_BUILD_CONFIGURATION.txt" 2>&1
          ENCAP_TEST_ENGINE="$prefix/bin/encap-engine" cargo test --locked -p encap-engine --test save_protocol -- --nocapture
          bash script/ffmpeg/qualify.sh "$prefix/bin/encap-engine"
          cargo test --locked -p encap-ffmpeg
          "$prefix/bin/encap-engine" validate-tools
          "$prefix/bin/ffmpeg" -hide_banner -version
          python3 script/build_desktop.py --rid 'linux-${{ matrix.label }}' --tools "$prefix/bin"
          prefix="$PWD/dist/staging/EnCap"
          mkdir -p "$prefix/share/applications" "$prefix/share/icons/hicolor/256x256/apps"
          cp desktop/packaging/com.tlolabs.encap.desktop "$prefix/share/applications/"
          cp assets/icons/png/EnCap-256.png "$prefix/share/icons/hicolor/256x256/apps/com.tlolabs.encap.png"
          dbus-run-session -- python3 script/test_media_session.py "$prefix/bin/libencap-media.so"
          xvfb-run -a python3 script/test_native_startup.py "$prefix/bin/EnCap"
          mkdir -p dist/release
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          bash script/package_appimage.sh "$(uname -m)" "$prefix" "$version"
      - name: Verify Linux cloning and mode-switch latency on Btrfs
        run: |
          image="$RUNNER_TEMP/encap-save-test.btrfs"
          mount_dir="$RUNNER_TEMP/encap-save-volume"
          truncate -s 3G "$image"
          mkfs.btrfs -f "$image"
          mkdir -p "$mount_dir"
          sudo mount -o loop "$image" "$mount_dir"
          trap 'sudo umount "$mount_dir"' EXIT
          sudo chown "$(id -u):$(id -g)" "$mount_dir"
          TMPDIR="$mount_dir" ENCAP_REQUIRE_CLONING=1 ENCAP_TEST_ENGINE="$PWD/dist/staging/EnCap/bin/encap-engine" \
            cargo test --locked -p encap-engine --test save_protocol -- --nocapture
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-linux-${{ matrix.label }}
          path: EnCAP/dist/release/*.AppImage
          if-no-files-found: error

  windows_runtime_probes:
    if: inputs.platform == 'runtime-probes'
    name: Windows x64 synthetic runtime probes
    runs-on: windows-2025
    defaults:
      run:
        working-directory: EnCAP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: EnCAP
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make curl tar xz git python
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-jq mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-llvm
      - uses: ./EnCAP/.github/actions/core-ffmpeg
        with:
          platform: windows
          arch: x86_64
          shell: msys2 {0}
      - name: Isolate synthetic filtering and encoding paths
        shell: msys2 {0}
        run: bash script/ffmpeg/probe-portrait.sh "$ENCAP_FFMPEG_RUNTIME/ffmpeg.exe"

  release:
    defaults:
      run:
        working-directory: EnCAP
    name: Publish GitHub release
    needs: [quality, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: EnCAP
      - name: Install update metadata tools
        run: |
          brew install squashfs gnupg
          python3 -m venv build/release-tools
          build/release-tools/bin/pip install -r script/update-tool-dependencies.txt
      - name: Verify approved signed stable release tag
        env:
          ENCAP_RELEASE_SIGNING_PUBLIC_KEY_B64: ${{ vars.ENCAP_RELEASE_SIGNING_PUBLIC_KEY_B64 }}
          ENCAP_RELEASE_SIGNING_FINGERPRINT: ${{ vars.ENCAP_RELEASE_SIGNING_FINGERPRINT }}
        run: bash script/verify_release_tag.sh
      - name: Require exact signed and qualified final packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/application_release.py --output release-assets
      - name: Generate and verify signed stable update metadata
        env:
          ENCAP_UPDATE_PRIVATE_KEY: ${{ secrets.ENCAP_UPDATE_PRIVATE_KEY }}
          ENCAP_UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version="$(python3 script/update_config.py --version)"
          test "$GITHUB_REF_NAME" = "v$version"
          build/release-tools/bin/python script/tlo_update_release.py --assets release-assets --version "$version" --tag "$GITHUB_REF_NAME"
          build/release-tools/bin/python script/sign_sparkle_feeds.py --assets release-assets
          build/release-tools/bin/python script/sign_sparkle_feeds.py --assets release-assets --verify
          build/release-tools/bin/python script/tlo_update_release.py --assets release-assets --verify
          build/release-tools/bin/python script/qualify_updates.py --assets release-assets
      - name: Attest authenticated final packages and metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: EnCAP/release-assets/*
      - name: Publish once and verify actual GitHub downloads
        env:
          GH_TOKEN: ${{ github.token }}
          ENCAP_UPDATE_PRIVATE_KEY: ${{ secrets.ENCAP_UPDATE_PRIVATE_KEY }}
          ENCAP_UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement of published bytes.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release download "$GITHUB_REF_NAME" --dir verified-downloads
          build/release-tools/bin/python script/tlo_update_release.py --assets verified-downloads --verify
          build/release-tools/bin/python script/sign_sparkle_feeds.py --assets verified-downloads --verify
          (cd verified-downloads && shasum -a 256 --check SHA256SUMS)
          for asset in verified-downloads/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-platforms.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners >/dev/null
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=true
          gh release download "$GITHUB_REF_NAME" --dir published-downloads
          build/release-tools/bin/python script/tlo_update_release.py --assets published-downloads --verify
          build/release-tools/bin/python script/sign_sparkle_feeds.py --assets published-downloads --verify
          build/release-tools/bin/python script/qualify_updates.py --assets published-downloads --published
