name: Build native platform apps

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FFMPEG_VERSION: "9.0.1"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  WHISPER_CPP_VERSION: "v1.9.1"
  WHISPER_CPP_COMMIT: "f049fff95a089aa9969deb009cdd4892b3e74916"

jobs:
  quality:
    defaults:
      run:
        working-directory: EnCAP
    name: Native engine checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          path: AVID Core
          persist-credentials: false
      - name: Enforce native-only source policy
        run: ./script/check_no_python.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify canonical media core
        run: |
          cargo fmt --manifest-path '../AVID Core/Cargo.toml' --all -- --check
          cargo check --manifest-path '../AVID Core/Cargo.toml' --locked --all-targets
          cargo test --manifest-path '../AVID Core/Cargo.toml' --locked --all-targets
          cargo clippy --manifest-path '../AVID Core/Cargo.toml' --locked --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build native engine
        run: cargo build --package encap-engine --locked

  macos:
    defaults:
      run:
        working-directory: EnCAP
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          path: AVID Core
          persist-credentials: false
      - name: Configure update verification key
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          mkdir -p src/encap
          if [[ -n "$UPDATE_PUBLIC_KEY" ]]; then
            printf '%s\n' "$UPDATE_PUBLIC_KEY" > src/encap/update_public_key.txt
          else
            printf '%s\n' 'development-build-no-update-key' > src/encap/update_public_key.txt
          fi
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build, test, sign, and package native app
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: ./script/build_and_run.sh --package
      - name: Test native models
        run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test --package-path macos --scratch-path build/native-swift
      - name: Verify packaged media tools
        run: |
          dist/EnCap.app/Contents/MacOS/encap-engine validate-tools
          dist/EnCap.app/Contents/MacOS/ffmpeg -hide_banner -version | grep "ffmpeg version $FFMPEG_VERSION"
          ! otool -L dist/EnCap.app/Contents/MacOS/ffmpeg | grep -E '/(opt|usr/local)/homebrew|/Cellar/'
          codesign --verify --deep --strict dist/EnCap.app
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-macos-${{ matrix.label }}
          path: EnCAP/dist/EnCap-*-macos-${{ matrix.label }}.dmg
          if-no-files-found: error

  windows:
    defaults:
      run:
        working-directory: EnCAP
    name: Windows ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            rust_target: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            cmake_arch: x64
            cmake_toolset: ""
            pe_machine: "8664"
            ffmpeg_archive: ffmpeg-n9.0.1-29-gad500d59cb-win64-gpl-9.0.zip
            ffmpeg_sha256: af971817c209439bb0374b5e623aca894042aa435426217d0dd5cfd15fb69d1b
          - label: arm64
            rust_target: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            cmake_arch: ARM64
            cmake_toolset: ClangCL
            pe_machine: "AA64"
            ffmpeg_archive: ffmpeg-n9.0.1-29-gad500d59cb-winarm64-gpl-9.0.zip
            ffmpeg_sha256: 8961216fe1fea620fefe893ae8b00f215b3351c3baa7705f7855d61c968296b1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          path: AVID Core
          persist-credentials: false
      - name: Install Rust target
        shell: pwsh
        run: rustup target add '${{ matrix.rust_target }}'
      - name: Download checksum-pinned FFmpeg 9.0.1 tools
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-11-13-20/${{ matrix.ffmpeg_archive }}'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.ffmpeg_sha256 }}') { throw "FFmpeg archive SHA-256 mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath .build-tools/ffmpeg
      - name: Build local Whisper runtime
        shell: pwsh
        run: |
          git clone --branch $env:WHISPER_CPP_VERSION --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-cpp
          if ((git -C .whisper-cpp rev-parse HEAD) -ne $env:WHISPER_CPP_COMMIT) { throw 'whisper.cpp commit mismatch' }
          $configure = @('-S', '.whisper-cpp', '-B', '.whisper-cpp/build', '-A', '${{ matrix.cmake_arch }}')
          if ('${{ matrix.cmake_toolset }}') { $configure += @('-T', '${{ matrix.cmake_toolset }}') }
          $configure += @('-DCMAKE_BUILD_TYPE=Release', '-DBUILD_SHARED_LIBS=OFF', '-DGGML_NATIVE=OFF', '-DGGML_OPENMP=OFF', '-DWHISPER_BUILD_TESTS=OFF', '-DWHISPER_BUILD_SERVER=OFF')
          cmake @configure
          cmake --build .whisper-cpp/build --config Release --target whisper-cli
      - name: Build shared Rust engine
        shell: pwsh
        run: cargo build --package encap-engine --release --locked --target '${{ matrix.rust_target }}'
      - name: Publish native WinUI 3 app
        shell: pwsh
        run: dotnet publish windows/EnCap/EnCap.csproj -c Release -r '${{ matrix.runtime }}' --self-contained true -p:Platform='${{ matrix.platform }}' -o dist/staging/EnCap
      - name: Assemble and verify portable package
        shell: pwsh
        run: |
          $stage = Resolve-Path dist/staging/EnCap
          Copy-Item 'target/${{ matrix.rust_target }}/release/encap-engine.exe' "$stage/encap-engine.exe"
          $ffmpeg = Get-ChildItem .build-tools/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem .build-tools/ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg archive is incomplete' }
          Copy-Item $ffmpeg.FullName "$stage/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$stage/ffprobe.exe"
          $whisper = Get-ChildItem .whisper-cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (!$whisper) { throw 'whisper-cli build is missing' }
          Copy-Item $whisper.FullName "$stage/whisper-cli.exe"
          Copy-Item THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          Copy-Item '../AVID Core/LICENSE' "$stage/AVID_CORE_LICENSE.txt"
          (& "$stage/ffmpeg.exe" -buildconf 2>&1) | Set-Content "$stage/FFMPEG_BUILD_CONFIGURATION.txt"
          function Assert-PeMachine([string] $path, [uint16] $expected) {
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "$path is not a PE executable" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "$path has an invalid PE header" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expected) { throw "$path has PE machine 0x$($machine.ToString('X4')); expected 0x$($expected.ToString('X4'))" }
          }
          $expectedMachine = [Convert]::ToUInt16('${{ matrix.pe_machine }}', 16)
          foreach ($executable in @('EnCap.exe', 'encap-engine.exe', 'ffmpeg.exe', 'ffprobe.exe', 'whisper-cli.exe')) {
            Assert-PeMachine "$stage/$executable" $expectedMachine
          }
          if ('${{ matrix.label }}' -eq 'x64') {
            $env:ENCAP_TEST_ENGINE = "$stage/encap-engine.exe"
            $env:ENCAP_FFMPEG = "$stage/ffmpeg.exe"
            $env:ENCAP_FFPROBE = "$stage/ffprobe.exe"
            $env:PATH = "$stage;" + $env:PATH
            cargo test --locked -p encap-engine --test media_contract -- --ignored
            if ($LASTEXITCODE -ne 0) { throw 'EnCAP packaged media tests failed' }
            cargo test --manifest-path '../AVID Core/Cargo.toml' --locked --test ffmpeg -- --ignored
            if ($LASTEXITCODE -ne 0) { throw 'Shared packaged media tests failed' }
            & "$stage/encap-engine.exe" validate-tools
            & "$stage/ffmpeg.exe" -hide_banner -version | Select-String "ffmpeg version $env:FFMPEG_VERSION"
          }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/release/EnCap-$version-windows-${{ matrix.label }}.zip"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-windows-${{ matrix.label }}
          path: EnCAP/dist/release/*.zip
          if-no-files-found: error

  linux:
    defaults:
      run:
        working-directory: EnCAP
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          path: AVID Core
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential cmake curl libadwaita-1-dev libgtk-4-dev libjson-glib-dev libtool meson nasm ninja-build xz-utils zlib1g-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build shared engine and bundled media tools
        run: |
          cargo build --package encap-engine --release --locked
          ./script/build_ffmpeg_linux.sh
      - name: Build local Whisper runtime
        run: |
          git clone --branch "$WHISPER_CPP_VERSION" --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-cpp
          test "$(git -C .whisper-cpp rev-parse HEAD)" = "$WHISPER_CPP_COMMIT"
          cmake -S .whisper-cpp -B .whisper-cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build .whisper-cpp/build --config Release --target whisper-cli
      - name: Build and assemble GTK 4 package
        run: |
          prefix="$PWD/dist/staging/EnCap"
          meson setup build/linux-native linux/EnCap --prefix="$prefix"
          meson compile -C build/linux-native
          meson install -C build/linux-native
          ffmpeg_prefix="$(./script/build_ffmpeg_linux.sh | tail -n 1)"
          cp target/release/encap-engine "$prefix/bin/encap-engine"
          cp "$ffmpeg_prefix/bin/ffmpeg" "$prefix/bin/ffmpeg"
          cp "$ffmpeg_prefix/bin/ffprobe" "$prefix/bin/ffprobe"
          cp .whisper-cpp/build/bin/whisper-cli "$prefix/bin/whisper-cli"
          cp THIRD_PARTY_NOTICES.md "$prefix/THIRD_PARTY_NOTICES.md"
          cp '../AVID Core/LICENSE' "$prefix/AVID_CORE_LICENSE.txt"
          "$prefix/bin/ffmpeg" -buildconf > "$prefix/FFMPEG_BUILD_CONFIGURATION.txt" 2>&1
          ENCAP_TEST_ENGINE="$prefix/bin/encap-engine" ENCAP_FFMPEG="$prefix/bin/ffmpeg" ENCAP_FFPROBE="$prefix/bin/ffprobe" cargo test --locked -p encap-engine --test media_contract -- --ignored
          PATH="$prefix/bin:$PATH" cargo test --manifest-path '../AVID Core/Cargo.toml' --locked --test ffmpeg -- --ignored
          "$prefix/bin/encap-engine" validate-tools
          "$prefix/bin/ffmpeg" -hide_banner -version | grep "ffmpeg version $FFMPEG_VERSION"
          mkdir -p dist/release
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tar -C dist/staging -czf "dist/release/EnCap-$version-linux-x64.tar.gz" EnCap
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-linux-x64
          path: EnCAP/dist/release/*.tar.gz
          if-no-files-found: error

  release:
    defaults:
      run:
        working-directory: EnCAP
    name: Publish GitHub release
    needs: [quality, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EnCAP
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          path: AVID Core
          persist-credentials: false
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: EnCAP/release-assets
          merge-multiple: true
      - name: Prepare draft release and signed update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ENCAP_UPDATE_PRIVATE_KEY: ${{ secrets.ENCAP_UPDATE_PRIVATE_KEY }}
          ENCAP_UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          cargo run --locked --package encap-release -- --assets-dir release-assets --version "$version" --tag "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
