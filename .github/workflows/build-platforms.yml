name: Build native platform apps

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FFMPEG_VERSION: "9.0.1"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  WHISPER_CPP_VERSION: "v1.9.1"
  WHISPER_CPP_COMMIT: "f049fff95a089aa9969deb009cdd4892b3e74916"

jobs:
  quality:
    name: Shared engine and compatibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install legacy reference application
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build compatibility engine
        run: cargo build --package encap-engine --locked
      - name: Test legacy behavior and file compatibility
        env:
          QT_QPA_PLATFORM: offscreen
          ENCAP_REQUIRE_MEDIA_TESTS: "1"
        run: python -m unittest discover -s tests -v

  macos:
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure update verification key
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          if [[ -n "$UPDATE_PUBLIC_KEY" ]]; then
            printf '%s\n' "$UPDATE_PUBLIC_KEY" > src/encap/update_public_key.txt
          else
            printf '%s\n' 'development-build-no-update-key' > src/encap/update_public_key.txt
          fi
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build, test, sign, and package native app
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: ./script/build_and_run.sh --package
      - name: Verify packaged media tools
        run: |
          dist/EnCap.app/Contents/MacOS/encap-engine validate-tools
          dist/EnCap.app/Contents/MacOS/ffmpeg -hide_banner -version | grep "ffmpeg version $FFMPEG_VERSION"
          ! otool -L dist/EnCap.app/Contents/MacOS/ffmpeg | grep -E '/(opt|usr/local)/homebrew|/Cellar/'
          codesign --verify --deep --strict dist/EnCap.app
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-macos-${{ matrix.label }}
          path: dist/EnCap-*-macos-${{ matrix.label }}.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            rust_target: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            cmake_arch: x64
            ffmpeg_archive: ffmpeg-n9.0.1-29-gad500d59cb-win64-gpl-9.0.zip
            ffmpeg_sha256: e536631f802a668172209a7f3f12bd7b87cd05dccebb498da7a518a3d6d3d037
          - label: arm64
            rust_target: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            cmake_arch: ARM64
            ffmpeg_archive: ffmpeg-n9.0.1-29-gad500d59cb-winarm64-gpl-9.0.zip
            ffmpeg_sha256: db61f2b7a34c4682666f364e6b144489c0bbf8e861a936dbdb4ca3164a60f377
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        shell: pwsh
        run: rustup target add '${{ matrix.rust_target }}'
      - name: Download checksum-pinned FFmpeg 9.0.1 tools
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-12-13-12/${{ matrix.ffmpeg_archive }}'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.ffmpeg_sha256 }}') { throw "FFmpeg archive SHA-256 mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath .build-tools/ffmpeg
      - name: Build local Whisper runtime
        shell: pwsh
        run: |
          git clone --branch $env:WHISPER_CPP_VERSION --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-cpp
          if ((git -C .whisper-cpp rev-parse HEAD) -ne $env:WHISPER_CPP_COMMIT) { throw 'whisper.cpp commit mismatch' }
          cmake -S .whisper-cpp -B .whisper-cpp/build -A '${{ matrix.cmake_arch }}' -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build .whisper-cpp/build --config Release --target whisper-cli
      - name: Build shared Rust engine
        shell: pwsh
        run: cargo build --package encap-engine --release --locked --target '${{ matrix.rust_target }}'
      - name: Publish native WinUI 3 app
        shell: pwsh
        run: dotnet publish windows/EnCap/EnCap.csproj -c Release -r '${{ matrix.runtime }}' --self-contained true -p:Platform='${{ matrix.platform }}' -o dist/staging/EnCap
      - name: Assemble and verify portable package
        shell: pwsh
        run: |
          $stage = Resolve-Path dist/staging/EnCap
          Copy-Item 'target/${{ matrix.rust_target }}/release/encap-engine.exe' "$stage/encap-engine.exe"
          $ffmpeg = Get-ChildItem .build-tools/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem .build-tools/ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg archive is incomplete' }
          Copy-Item $ffmpeg.FullName "$stage/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$stage/ffprobe.exe"
          $whisper = Get-ChildItem .whisper-cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (!$whisper) { throw 'whisper-cli build is missing' }
          Copy-Item $whisper.FullName "$stage/whisper-cli.exe"
          Copy-Item THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          & "$stage/encap-engine.exe" validate-tools
          & "$stage/ffmpeg.exe" -hide_banner -version | Select-String "ffmpeg version $env:FFMPEG_VERSION"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/release/EnCap-$version-windows-${{ matrix.label }}.zip"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-windows-${{ matrix.label }}
          path: dist/release/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential cmake curl libadwaita-1-dev libgtk-4-dev libjson-glib-dev libtool meson nasm ninja-build xz-utils zlib1g-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build shared engine and bundled media tools
        run: |
          cargo build --package encap-engine --release --locked
          ./script/build_ffmpeg_linux.sh
      - name: Build local Whisper runtime
        run: |
          git clone --branch "$WHISPER_CPP_VERSION" --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-cpp
          test "$(git -C .whisper-cpp rev-parse HEAD)" = "$WHISPER_CPP_COMMIT"
          cmake -S .whisper-cpp -B .whisper-cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build .whisper-cpp/build --config Release --target whisper-cli
      - name: Build and assemble GTK 4 package
        run: |
          prefix="$PWD/dist/staging/EnCap"
          meson setup build/linux-native linux/EnCap --prefix="$prefix"
          meson compile -C build/linux-native
          meson install -C build/linux-native
          ffmpeg_prefix="$(./script/build_ffmpeg_linux.sh | tail -n 1)"
          cp target/release/encap-engine "$prefix/bin/encap-engine"
          cp "$ffmpeg_prefix/bin/ffmpeg" "$prefix/bin/ffmpeg"
          cp "$ffmpeg_prefix/bin/ffprobe" "$prefix/bin/ffprobe"
          cp .whisper-cpp/build/bin/whisper-cli "$prefix/bin/whisper-cli"
          cp THIRD_PARTY_NOTICES.md "$prefix/THIRD_PARTY_NOTICES.md"
          "$prefix/bin/encap-engine" validate-tools
          "$prefix/bin/ffmpeg" -hide_banner -version | grep "ffmpeg version $FFMPEG_VERSION"
          mkdir -p dist/release
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tar -C dist/staging -czf "dist/release/EnCap-$version-linux-x64.tar.gz" EnCap
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnCap-linux-x64
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [quality, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare draft release and signed update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ENCAP_UPDATE_PRIVATE_KEY: ${{ secrets.ENCAP_UPDATE_PRIVATE_KEY }}
          ENCAP_UPDATE_PUBLIC_KEY: ${{ vars.ENCAP_UPDATE_PUBLIC_KEY }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          python -m pip install --disable-pip-version-check "cryptography==43.0.3"
          python scripts/build_release_metadata.py --assets-dir release-assets --version "$version" --tag "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
