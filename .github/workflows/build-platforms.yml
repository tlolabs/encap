          }
          $expectedMachine = [Convert]::ToUInt16('AA64', 16)
          foreach ($executable in @('EnCap.exe', 'encap-engine.exe', 'encap-update.exe', 'encap-portable-update.exe', 'ffmpeg.exe', 'ffprobe.exe', 'whisper-cli.exe')) {
            Assert-PeMachine "$stage/$executable" $expectedMachine
          }
          & {
            $env:ENCAP_TEST_PACKAGED = "1"
