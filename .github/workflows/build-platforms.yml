      - name: Check portable persistence tests for target architecture
        shell: pwsh
        run: cargo check --locked -p encap-core --tests --target 'aarch64-pc-windows-msvc'
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: EnCAP/global.json
      - name: Test shared application and headless UI
        shell: pwsh
        run: |
          python script/update_config.py --props build/version.props
          dotnet run --project desktop/EnCap.Tests --configuration Release -- tests/fixtures/chapter-times.tsv
      - name: Informational Windows accessibility checks
        shell: pwsh
        continue-on-error: true
        run: dotnet run --project desktop/EnCap.Tests --configuration Release -- tests/fixtures/chapter-times.tsv --accessibility
      - name: Publish portable update installer
        shell: pwsh
        run: |
          python script/update_config.py --props build/version.props
          dotnet publish windows/PortableUpdate/PortableUpdate.csproj -c Release -r 'win-arm64' --self-contained true -o build/portable-update
          if ($LASTEXITCODE -ne 0) { throw 'Updater bootstrapper build failed' }
      - name: Assemble and verify portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stage = New-Item -ItemType Directory -Force build/desktop-tools
          Copy-Item 'target/aarch64-pc-windows-msvc/release/encap-engine.exe' "$stage/encap-engine.exe"
          Copy-Item 'target/aarch64-pc-windows-msvc/release/encap-update.exe' "$stage/encap-update.exe"
          Copy-Item 'build/portable-update/encap-portable-update.exe' "$stage/encap-portable-update.exe"
