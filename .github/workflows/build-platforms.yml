  linux_btrfs:
    name: Linux Btrfs save regression diagnostics
    needs: [linux_x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: EnCAP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: EnCAP
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: EnCap-linux-x64
          path: EnCAP/dist
      - name: Exercise packaged engine on Btrfs
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs
          packages=(dist/EnCap-*-linux-x64.AppImage)
          test "${#packages[@]}" -eq 1
          chmod +x "${packages[0]}"
          "${packages[0]}" --appimage-extract >/dev/null
          image="$RUNNER_TEMP/encap-save-test.btrfs"
          mount_dir="$RUNNER_TEMP/encap-save-volume"
          truncate -s 3G "$image"
          mkfs.btrfs -f "$image"
          mkdir -p "$mount_dir"
          sudo mount -o loop "$image" "$mount_dir"
          trap 'sudo umount "$mount_dir"' EXIT
          sudo chown "$(id -u):$(id -g)" "$mount_dir"
          export PATH="$PWD/squashfs-root/usr/bin:$PATH"
          TMPDIR="$mount_dir" ENCAP_REQUIRE_CLONING=1 ENCAP_TEST_ENGINE="$PWD/squashfs-root/usr/bin/encap-engine" \
            cargo test --locked -p encap-engine --test save_protocol -- --nocapture


