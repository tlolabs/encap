name: Verify and attest native Linux AppImages
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Same-commit native Linux qualification run
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare Linux AppImages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate exact native AppImage inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.native_run }}
        run: python3 script/acquire_app_artifact.py --run "$SOURCE_RUN" --workflow .github/workflows/build-platforms.yml --platform linux --output unsigned
      - name: Preserve authenticated final AppImage bytes
        run: |
          set -euo pipefail
          mkdir verified-packages
          mapfile -d '' images < <(find unsigned -type f -name '*.AppImage' -print0)
          test "${#images[@]}" = 2
          for image in "${images[@]}"; do
            cp "$image" verified-packages/
            cmp "$image" "verified-packages/$(basename "$image")"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: verified-packages/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-linux-appimages
          path: verified-packages/*
          if-no-files-found: error
  verify-native:
    name: Verify Linux ${{ matrix.target }}
    needs: prepare
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            label: x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            label: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-linux-appimages
          path: verified-packages
      - name: Validate final AppImage on its native architecture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          images=(verified-packages/*-linux-${{ matrix.label }}.AppImage)
          test "${#images[@]}" = 1
          gh attestation verify "${images[0]}" --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/verify-linux.yml' --source-digest '${{ github.sha }}' --deny-self-hosted-runners
          chmod +x "${images[0]}"
          mkdir final-native
          image="$(realpath "${images[0]}")"
          (cd final-native && "$image" --appimage-extract)
          python3 script/ffmpeg_runtime.py validate '${{ matrix.target }}' --binary final-native/squashfs-root/usr/bin --metadata final-native/squashfs-root/usr/bin/ffmpeg-runtime
