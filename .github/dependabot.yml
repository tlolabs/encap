version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: nuget
    directory: /windows/EnCap
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: swift
    directory: /helpers/whisperkit_transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
